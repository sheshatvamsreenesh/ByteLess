  # Good candidates: BBC News, Reuters, The Guardian, AP News,
  # Wikipedia current-events pages, etc.  Check each site's robots.txt first.

  - url: ""                        # ← Paste the full URL here (https://...)
    category: news_and_articles
    approved: false                # ← Change to true after YOUR review
    notes: ""                      # ← e.g. "BBC News article, robots.txt checked 2026-11-03"

